apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: sre-shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order
          image: sre/order-service:local
          envFrom:
            - configMapRef:
                name: sre-config
            - secretRef:
                name: sre-secrets
          ports:
            - containerPort: 8003
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: sre-shop
spec:
  selector:
    app: order-service
  ports:
    - port: 8003
---
