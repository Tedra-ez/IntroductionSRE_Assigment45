apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: sre-shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth
          image: sre/auth-service:local
          ports:
            - containerPort: 8001
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: sre-shop
spec:
  selector:
    app: auth-service
  ports:
    - port: 8001
---
