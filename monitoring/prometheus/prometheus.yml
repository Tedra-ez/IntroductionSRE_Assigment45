global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: microservices
    metrics_path: /metrics
    static_configs:
      - targets:
          - auth-service:8001
          - product-service:8002
          - order-service:8003
          - payment-service:8004
          - notification-service:8005
          - user-profile-service:8006
          - api-gateway:8080

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
