groups:
  - name: sre_slo_alerts
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"[45].."}[5m]))
          /
          clamp_min(sum(rate(http_requests_total[5m])), 0.001) > 0.01
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Error rate above 1% SLO"
          description: "HTTP 5xx ratio exceeds 1% for 2 minutes."

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))
          > 0.2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "P95 latency above 200ms SLO"

      - alert: OrderServiceDown
        expr: up{job="microservices", instance="order-service:8003"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Order service unavailable"

      - alert: ServiceDown
        expr: up{job="microservices"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Microservice target down ({{ $labels.instance }})"
